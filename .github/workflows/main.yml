name: Build, Testes e Deploy (AgroNASA)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: Roda os testes do backend Python (test_scoring.py)
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./agronasa-main/agro-backend
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Rodar testes automatizados
        run: pytest

  # Job 2: Publica a pasta docs no GitHub Pages
  deploy-pages:
    needs: test-backend
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos da pasta agronasa-main/docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: './agronasa-main/docs'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
